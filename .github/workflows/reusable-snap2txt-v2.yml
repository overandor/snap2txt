name: Reusable Snap2Txt Snapshot v2

on:
  workflow_call:

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot every pushed commit
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Snap2Txt
        run: python -m pip install --disable-pip-version-check "snap2txt==0.2.2"

      - name: Determine commits introduced by this push
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          : > "$RUNNER_TEMP/snap2txt-commits.txt"

          if [[ -z "${AFTER_SHA:-}" || "$AFTER_SHA" == "$ZERO_SHA" ]]; then
            echo "No live commit to snapshot." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "$ZERO_SHA" ]] \
             && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null; then
            git rev-list --reverse "$BEFORE_SHA..$AFTER_SHA" > "$RUNNER_TEMP/snap2txt-commits.txt"
          else
            printf '%s\n' "$AFTER_SHA" > "$RUNNER_TEMP/snap2txt-commits.txt"
          fi

          if [[ ! -s "$RUNNER_TEMP/snap2txt-commits.txt" ]]; then
            printf '%s\n' "$AFTER_SHA" > "$RUNNER_TEMP/snap2txt-commits.txt"
          fi

          echo "### Snap2Txt commit set" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- `/' "$RUNNER_TEMP/snap2txt-commits.txt" | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate deterministic, redacted snapshots
        shell: bash
        env:
          SNAP2TXT_COMMITS_FILE: ${{ runner.temp }}/snap2txt-commits.txt
          SNAP2TXT_OUTPUT_DIR: ${{ runner.temp }}/snap2txt-output
          SNAP2TXT_WORK_DIR: ${{ runner.temp }}/snap2txt-work
          SNAP2TXT_MAX_FILE_BYTES: "2097152"
          SNAP2TXT_MAX_TOTAL_BYTES: "268435456"
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import gzip
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          from pathlib import Path

          commits_file = Path(os.environ["SNAP2TXT_COMMITS_FILE"])
          output_root = Path(os.environ["SNAP2TXT_OUTPUT_DIR"])
          work_root = Path(os.environ["SNAP2TXT_WORK_DIR"])
          max_file_bytes = int(os.environ["SNAP2TXT_MAX_FILE_BYTES"])
          max_total_bytes = int(os.environ["SNAP2TXT_MAX_TOTAL_BYTES"])

          output_root.mkdir(parents=True, exist_ok=True)
          work_root.mkdir(parents=True, exist_ok=True)

          commits = [line.strip() for line in commits_file.read_text().splitlines() if line.strip()]
          if not commits:
              raise SystemExit("No commits found to snapshot")

          excluded_dirs = {
              ".git", ".github-snap2txt-work", ".venv", "venv", "env",
              "node_modules", "vendor", "vendors", "dist", "build", "target",
              ".next", ".nuxt", ".cache", "coverage", "__pycache__", ".terraform",
              ".idea", ".vscode", "Pods", "DerivedData",
          }
          excluded_names = {
              "project_contents.txt", "package-lock.json", "pnpm-lock.yaml",
              "yarn.lock", "bun.lockb", "Cargo.lock", "poetry.lock",
              "Pipfile.lock", "composer.lock", "Gemfile.lock",
          }
          sensitive_name_patterns = [
              re.compile(r"(^|/)\.env($|\.)", re.I),
              re.compile(r"(^|/)(id_rsa|id_dsa|id_ed25519)(\.|$)", re.I),
              re.compile(r"\.(pem|p12|pfx|key|keystore|jks)$", re.I),
              re.compile(r"(^|/)(credentials?|secrets?)(\.|/|$)", re.I),
          ]
          redactions = [
              (re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----", re.S), "[REDACTED_PRIVATE_KEY]"),
              (re.compile(r"\b(?:sk|rk|pk)-(?:proj-)?[A-Za-z0-9_-]{20,}\b"), "[REDACTED_API_KEY]"),
              (re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}\b"), "[REDACTED_GITHUB_TOKEN]"),
              (re.compile(r"\bAKIA[0-9A-Z]{16}\b"), "[REDACTED_AWS_ACCESS_KEY]"),
              (re.compile(r"(?i)(authorization\s*[:=]\s*bearer\s+)[A-Za-z0-9._~+/=-]{12,}"), r"\1[REDACTED]"),
          ]

          def sha256_file(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def safe_extract(repo_tar: Path, destination: Path) -> None:
              with tarfile.open(repo_tar, "r") as archive:
                  root = destination.resolve()
                  for member in archive.getmembers():
                      target = (destination / member.name).resolve()
                      if target != root and root not in target.parents:
                          raise RuntimeError(f"Unsafe archive member: {member.name}")
                      if member.issym() or member.islnk() or member.isdev():
                          continue
                      archive.extract(member, destination, filter="data")

          index = {
              "schema": "snap2txt-fleet-index/v1",
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "snap2txt_version": "0.2.2",
              "commits": [],
          }

          for commit in commits:
              work = work_root / commit
              raw = work / "raw"
              raw.mkdir(parents=True, exist_ok=True)
              tar_path = work / "repository.tar"

              with tar_path.open("wb") as tar_out:
                  subprocess.run(["git", "archive", "--format=tar", commit], stdout=tar_out, check=True)
              safe_extract(tar_path, raw)
              tar_path.unlink(missing_ok=True)

              included = []
              skipped = []
              included_bytes = 0

              for path in sorted(raw.rglob("*"), key=lambda item: item.as_posix()):
                  rel = path.relative_to(raw).as_posix()
                  if path.is_symlink():
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "symlink"})
                      continue
                  if path.is_dir():
                      continue
                  if any(part in excluded_dirs for part in path.relative_to(raw).parts[:-1]):
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "excluded_directory"})
                      continue
                  if path.name in excluded_names:
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "generated_or_lockfile"})
                      continue
                  if any(pattern.search(rel) for pattern in sensitive_name_patterns):
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "sensitive_filename"})
                      continue

                  size = path.stat().st_size
                  if size > max_file_bytes:
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "file_size_limit", "bytes": size})
                      continue
                  if included_bytes + size > max_total_bytes:
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "snapshot_size_budget", "bytes": size})
                      continue

                  data = path.read_bytes()
                  if b"\x00" in data:
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "binary"})
                      continue
                  try:
                      text = data.decode("utf-8")
                  except UnicodeDecodeError:
                      path.unlink(missing_ok=True)
                      skipped.append({"path": rel, "reason": "non_utf8"})
                      continue

                  for pattern, replacement in redactions:
                      text = pattern.sub(replacement, text)
                  path.write_text(text, encoding="utf-8")
                  final_size = path.stat().st_size
                  included_bytes += final_size
                  included.append({"path": rel, "bytes": final_size})

              commit_out = output_root / commit
              commit_out.mkdir(parents=True, exist_ok=True)
              subprocess.run(["snap2txt"], cwd=raw, check=True)
              generated = raw / "project_contents.txt"
              if not generated.exists():
                  raise RuntimeError(f"Snap2Txt did not create output for {commit}")

              text_out = commit_out / "project_contents.txt"
              shutil.move(str(generated), text_out)
              gzip_out = commit_out / "project_contents.txt.gz"
              with text_out.open("rb") as source, gzip_out.open("wb") as raw_gzip:
                  with gzip.GzipFile(filename="project_contents.txt", mode="wb", fileobj=raw_gzip, compresslevel=9, mtime=0) as destination:
                      shutil.copyfileobj(source, destination)

              manifest = {
                  "schema": "snap2txt-commit-manifest/v1",
                  "repository": os.environ.get("GITHUB_REPOSITORY", ""),
                  "commit": commit,
                  "generator": "snap2txt",
                  "generator_version": "0.2.2",
                  "redacted": True,
                  "max_file_bytes": max_file_bytes,
                  "max_total_bytes": max_total_bytes,
                  "included_file_count": len(included),
                  "included_source_bytes": included_bytes,
                  "skipped_file_count": len(skipped),
                  "snapshot_bytes": text_out.stat().st_size,
                  "snapshot_sha256": sha256_file(text_out),
                  "gzip_bytes": gzip_out.stat().st_size,
                  "gzip_sha256": sha256_file(gzip_out),
                  "included": included,
                  "skipped": skipped,
              }
              (commit_out / "manifest.json").write_text(
                  json.dumps(manifest, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              index["commits"].append({
                  "commit": commit,
                  "manifest": f"{commit}/manifest.json",
                  "snapshot_sha256": manifest["snapshot_sha256"],
                  "included_file_count": len(included),
                  "skipped_file_count": len(skipped),
              })
              shutil.rmtree(work, ignore_errors=True)
              print(
                  f"snap2txt {commit[:12]}: {len(included)} files, "
                  f"{text_out.stat().st_size} output bytes, sha256={manifest['snapshot_sha256']}"
              )

          (output_root / "index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish snapshot receipt summary
        shell: bash
        env:
          SNAP2TXT_OUTPUT_DIR: ${{ runner.temp }}/snap2txt-output
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          index = json.loads((Path(os.environ["SNAP2TXT_OUTPUT_DIR"]) / "index.json").read_text())
          print("\n### Snap2Txt receipts")
          print("| Commit | Included | Skipped | SHA-256 |")
          print("|---|---:|---:|---|")
          for item in index["commits"]:
              print(
                  f"| `{item['commit'][:12]}` | {item['included_file_count']} | "
                  f"{item['skipped_file_count']} | `{item['snapshot_sha256']}` |"
              )
          PY

      - name: Upload per-commit Snap2Txt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snap2txt-${{ github.repository_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/snap2txt-output
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
