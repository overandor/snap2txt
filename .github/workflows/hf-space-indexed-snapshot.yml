name: HF Space to indexed Snap2Txt chunks

on:
  workflow_dispatch:
    inputs:
      hf_repo_id:
        description: Hugging Face Space in owner/name form
        required: true
        default: josephrw/rentmasseur-optimizer
      chunk_lines:
        description: Maximum original lines per readable chunk
        required: true
        default: "800"
      publish_branch:
        description: Branch that stores indexes, chunks, and ZIP archives
        required: true
        default: snapshots
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: hf-space-indexed-snapshot-${{ github.event.inputs.hf_repo_id || 'josephrw-rentmasseur-optimizer' }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      HF_REPO_ID: ${{ github.event.inputs.hf_repo_id || 'josephrw/rentmasseur-optimizer' }}
      CHUNK_LINES: ${{ github.event.inputs.chunk_lines || '800' }}
      PUBLISH_BRANCH: ${{ github.event.inputs.publish_branch || 'snapshots' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out Snap2Txt fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Snap2Txt and Hub client
        run: |
          python -m pip install --upgrade pip
          python -m pip install . huggingface_hub

      - name: Resolve paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          SLUG="${HF_REPO_ID//\//__}"
          SOURCE_DIR="$RUNNER_TEMP/hf-source"
          STAGE_DIR="$RUNNER_TEMP/indexed-snapshot"
          ARCHIVE_NAME="${SLUG}-indexed-snapshot.zip"
          TARGET_DIR="snapshots/${SLUG}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "source_dir=$SOURCE_DIR" >> "$GITHUB_OUTPUT"
          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"
          echo "archive_name=$ARCHIVE_NAME" >> "$GITHUB_OUTPUT"
          echo "target_dir=$TARGET_DIR" >> "$GITHUB_OUTPUT"

      - name: Download Hugging Face Space snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ steps.paths.outputs.source_dir }}"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          token = os.environ.get("HF_TOKEN") or None
          snapshot_download(
              repo_id=os.environ["HF_REPO_ID"],
              repo_type="space",
              local_dir="${{ steps.paths.outputs.source_dir }}",
              token=token,
          )
          PY

      - name: Generate complete Snap2Txt file
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.paths.outputs.source_dir }}"
          snap2txt
          test -s project_contents.txt
          wc -l project_contents.txt
          sha256sum project_contents.txt

      - name: Split, index, verify, and zip
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ steps.paths.outputs.stage_dir }}"
          mkdir -p "${{ steps.paths.outputs.stage_dir }}"
          python tools/chunk_snapshot.py \
            "${{ steps.paths.outputs.source_dir }}/project_contents.txt" \
            --output-dir "${{ steps.paths.outputs.stage_dir }}/chunks" \
            --chunk-lines "$CHUNK_LINES" \
            --archive-name "${{ steps.paths.outputs.archive_name }}" \
            --source-label "hf://spaces/$HF_REPO_ID"
          test -s "${{ steps.paths.outputs.stage_dir }}/chunks/index.json"
          test -s "${{ steps.paths.outputs.stage_dir }}/${{ steps.paths.outputs.archive_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.slug }}-indexed-snapshot
          path: |
            ${{ steps.paths.outputs.stage_dir }}/chunks
            ${{ steps.paths.outputs.stage_dir }}/${{ steps.paths.outputs.archive_name }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish readable chunks to branch
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="${{ steps.paths.outputs.stage_dir }}"
          TARGET_DIR="${{ steps.paths.outputs.target_dir }}"
          ARCHIVE_NAME="${{ steps.paths.outputs.archive_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$PUBLISH_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$PUBLISH_BRANCH:$PUBLISH_BRANCH"
            git switch "$PUBLISH_BRANCH"
          else
            git switch --orphan "$PUBLISH_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR/chunks"
          cp "$STAGE_DIR/chunks/index.json" "$TARGET_DIR/index.json"
          cp "$STAGE_DIR/chunks/index.md" "$TARGET_DIR/index.md"
          cp "$STAGE_DIR/chunks/checksums.sha256" "$TARGET_DIR/checksums.sha256"
          cp "$STAGE_DIR/chunks"/chunk_*.txt "$TARGET_DIR/chunks/"
          cp "$STAGE_DIR/$ARCHIVE_NAME" "$TARGET_DIR/$ARCHIVE_NAME"

          cat > "$TARGET_DIR/README.md" <<EOF
          # ${HF_REPO_ID} indexed Snap2Txt snapshot

          Start with [index.md](index.md). It maps every original line range to one small text file under [chunks](chunks/).

          The ZIP archive [${ARCHIVE_NAME}](${ARCHIVE_NAME}) contains the untouched full project_contents.txt, every chunk, the indexes, and SHA-256 checksums.
          EOF
          sed -i $'s/\x1b//g' "$TARGET_DIR/README.md"

          cat > README.md <<EOF
          # Published indexed Snap2Txt snapshots

          These files are generated by GitHub Actions from Hugging Face Spaces.

          - [${HF_REPO_ID}](${TARGET_DIR}/index.md)
          EOF

          git add README.md "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No snapshot changes to publish."
            exit 0
          fi

          git commit -m "Publish indexed snapshot for ${HF_REPO_ID}"
          git push origin "$PUBLISH_BRANCH"
